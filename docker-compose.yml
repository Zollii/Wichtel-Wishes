services:
  app:
    build: .
    image: wichtel-app
    ports:
      # Reachable on port 3002 of the server; inside the container the app uses 3000
      - "3002:3000"
    environment:
      - DATABASE_URL=file:/app/data/wichtel.db
      # Read from the shell or a .env file next to this compose file
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Please set ADMIN_PASSWORD}
    volumes:
      # Persist the SQLite database
      - wichtel_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wichtel_data:
